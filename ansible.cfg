[defaults]
# Where to find inventory (you'll create this from inventory.example/)
inventory                = inventory/hosts

# Where to find roles — bundled library at ./roles plus any Galaxy-installed roles
roles_path               = roles:collections/ansible_roles

# Where to find collections (installed by `make install`)
collections_paths        = collections

# Sensible defaults
host_key_checking        = False
forks                    = 10
gathering                = smart
fact_caching             = jsonfile
fact_caching_connection  = .ansible-cache
fact_caching_timeout     = 7200
retry_files_enabled      = False
stdout_callback          = yaml
callbacks_enabled        = profile_tasks, timer
deprecation_warnings     = True

# Default vault password file location (override per-run if needed)
# Uncomment after creating .vault_pass:
# vault_password_file    = .vault_pass

[inventory]
# Don't choke on Python interpreter discovery
unparsed_is_failed = True

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o PreferredAuthentications=publickey,password
control_path_dir = ~/.ansible/cp

[persistent_connection]
connect_timeout = 30
command_timeout = 60

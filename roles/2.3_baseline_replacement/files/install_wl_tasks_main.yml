- name: Clean up installation artifacts
  become: true
  become_user: "{{os_user}}"
  file:
    path: "{{ temp_install_dir}}"
    state: absent

- name: Create logs directory in Middleware home
  become_user: app_admin
  file:
    path: "{{ middleware_logs }}"
    state: directory
    owner: app_admin
    group: app_admin

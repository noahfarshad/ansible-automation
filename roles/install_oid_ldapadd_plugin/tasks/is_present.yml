---
# tasks file for install_oid_ldapadd_plugin — present

# To maintain idempotence first check to see if the plugin is already installed
- name: "search ldap for plugin"

  become_user: app_admin
  ansible.builtin.shell: "{{ldap_bin}}/ldapsearch -h localhost -p 3060 -D cn={{ldap_user}} -w {{ldap_password}} -L \"(cn={{plugin_name}})\""
  register: plugin_status
  environment:
    ORACLE_HOME: "{{idm_oracle_home}}"

# If this is a replace rather than an add, delete the existing plugin from ldap and plugins folder
  # TODO: review changed_when for: {{ldap_bin}}/ldapsearch -h localhost -p 3060 -D cn={{ldap_us
- name: "remove plugin from ldap"

  become_user: app_admin
  ansible.builtin.command: "{{ldap_bin}}/ldapdelete -h localhost -p 3060 -D cn={{ldap_user}} -w {{ldap_password}} cn=NewUserPlugin,cn=plugin,cn=subconfigsubentry"
  when:
    - "plugin_name in plugin_status.stdout"
    - "force_replace == 'true'"
  environment:
    ORACLE_HOME: "{{idm_oracle_home}}"


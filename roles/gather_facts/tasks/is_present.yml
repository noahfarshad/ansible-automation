---
# tasks file for gather_facts — present

# Deploy a guest from a template
- block:
    - name: Gather resource pool facts
      vmware_resource_pool_facts:
        ansible.builtin.hostname: "{{ vsphere_host }}"
        username: "{{ vsphere_user }}"
        password: "{{ vsphere_pass }}"
        validate_certs: no
      delegate_to: localhost
      register: resource_pool_facts

    - name: Gather resource pool facts
      vmware_guest_facts:
        ansible.builtin.hostname: "{{ vsphere_host }}"
        username: "{{ vsphere_user }}"
        password: "{{ vsphere_pass }}"
        name: "{{ vm_name }}"
        datacenter: "{{ vsphere_datacenter }}"
        validate_certs: no
      delegate_to: localhost
      register: vm_facts

    - debug:
        msg: "{{ vm_facts }}"
  become: true

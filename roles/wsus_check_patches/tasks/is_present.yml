---
# tasks file for wsus_check_patches — present
#
# Collects the list of installed Windows hotfixes and writes the report to
# a shared path. Designed for Windows hosts joined to a domain.

- block:
    - name: Get list of applied patches
      ansible.windows.win_shell: |
        Get-HotFix | Sort-Object -Descending -Property InstalledOn
      register: hotfix_results
      changed_when: false

    - name: Get timestamp
      ansible.windows.win_shell: |
        Get-Date -Format yy-MM-dd_HH-mm-ss
      register: tstamp
      changed_when: false
  become: true
  become_method: runas
  become_flags: 'logon_type=new_credentials logon_flags=netcredentials_only'
  vars:
    ansible_become_user: "{{ system_name }}\\{{ domainadmin_user }}"
    ansible_become_password: "{{ domain_password }}"

- name: Write hotfix report to share
  ansible.windows.win_copy:
    content: "{{ hotfix_results.stdout }}"
    dest: "{{ wsus_report_share }}\\{{ inventory_hostname_short }}_{{ tstamp.stdout | trim }}.txt"

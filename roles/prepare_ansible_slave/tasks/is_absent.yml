---
# tasks file for prepare_ansible_slave — absent
#
# Stops the service, removes the package.

- name: Stop and disable service
  ansible.builtin.service:
    name: "service_name"
    state: stopped
    enabled: false
  failed_when: false

- name: Remove package(s)
  ansible.builtin.package:
    name: "{{ item | default([]) }}"
    state: absent
  when: (item | default([])) | length > 0

---
 
- name: Add DNS A Record
  vars:
    ansible_connection: "winrm"
    ansible_user: "{{ domainadmin_user }}"
    ansible_password: "{{ domain_password }}"
  community.windows.win_dns_record: 
    computer_name: "{{dcserver}}"
    name: "{{inventory_hostname}}."
    type: "A"
    value: "{{ip_public}}"
    zone: "{{domain}}"
  delegate_to: "{{ dcserver }}"

- name: Create matching PTR record
  vars:
    ansible_connection: "winrm"
    ansible_user: "{{ domainadmin_user }}"
    ansible_password: "{{ domain_password }}"
  community.windows.win_dns_record:
    computer_name: "{{dcserver}}"
    name: "{{ ip_public.split('.')[3] }}" 
    type: "PTR"
    value: "{{hostname}}." 
    zone: "{{ip_public.split('.')[2]}}.{{ip_public.split('.')[1]}}.{{ip_public.split('.')[0]}}.in-addr.arpa" 
  delegate_to: "{{ dcserver }}"
  
---
# tasks file for deploy_vm — present

# Each deploy task list requires a template name to be found using the parameters.template var as a key 
# in the os_templates dict, under group_vars/all/vars.yml
# There are two options for supplying the host vars to build with
# 1. Specifying a specific esxi_hostname (currently used for WCL1)
# 2. Specifying a cluster name to to deploy to 
#
# if the esxi_hostname var is set and defined it will be used, otherwise the cluster var is expected for deployment
#


#- debug:
#    msg: "Using {{ parameters.template }} for {{ inventory_hostname }}"

- name: Create Folder in Vcenter
  ansible.builtin.import_tasks: "create_folder.yml"
  tags: [ create_vcenter_folder ]

- name: Deploy Redhat VM
  when:  "('rhel' in parameters.template) or ('rhel' in hostvars[ inventory_hostname ].os) or ('linux' in hostvars[ inventory_hostname ].os)"
  ansible.builtin.import_tasks: "rhel.yml"
  tags: [ deploy_rhel ]

- name: Create Windows VM from Template
  when: "('win' in parameters.template) or ('win' in hostvars[ inventory_hostname ].os) or ('server' in hostvars[ inventory_hostname ].os)"
  ansible.builtin.import_tasks: "windows.yml"
  tags: [ deploy_windows ]

- name: Create Solaris VM from Template
  when: "('solaris' in parameters.template) or ('solaris' in hostvars[ inventory_hostname ].os)"
  ansible.builtin.import_tasks: "solaris.yml"
  tags: [ deploy_solaris ]

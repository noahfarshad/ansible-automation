---
- name: Install Kerberos and LDAP clients
  become: true
  ansible.builtin.yum: name={{ item }} state=present
  ignore_errors: yes
  loop:
    - krb5-workstation
    - openldap-clients

- name: Configure Kerberos integration with AD
  become: true
  ansible.builtin.template: src=krb5.conf dest=/etc/krb5.conf
            owner=root group=root mode=0644

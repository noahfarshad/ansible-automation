---
# tasks file for install_hazelcast_server — present

# Create the destination directory
- name: Create the Hazelcast service directory
  become: true
  ansible.builtin.file:
    path: "{{hazelcast_directory}}"
    state: directory
    owner: app_admin
    ansible.builtin.group: app_admin
    mode: 0755
  tags:
    - hazelcast

# Copy artifacts from staging
- name: Copy artifacts for the service instance
  become: true
  become_user: app_admin
  ansible.builtin.copy:
    src: "{{staging}}/{{item.artifact}}-{{item.version}}.{{item.ext}}"
    dest: "{{hazelcast_directory}}"
    mode: 0755
  loop: "{{cache_libraries}}"
  tags:
    - hazelcast

- name: Get group names
  ansible.builtin.set_fact:
    ansible.builtin.hostname: "{{group_names}}"
  tags:
    - hazelcast



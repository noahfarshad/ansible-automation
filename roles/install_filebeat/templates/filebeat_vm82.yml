- type: log
  paths:
    - /opt/hazelcast/hazelcast.log
  tags: ['{{ system }}', '{{ ansible_hostname }}', 'hazelcast']
  multiline.pattern: '^[[:upper:]][[:alpha:]]{2}'
  multiline.negate: true
  multiline.match: after

- type: log
  paths:
    - "{{neo4j_dir}}/{{neo4j_package}}/logs/neo4j.log"
    - "{{neo4j_dir}}/{{neo4j_package}}/logs/debug.log"
  tags: ['{{ system }}', '{{ ansible_hostname }}', 'neo4j']
  multiline.pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}'
  multiline.negate: true
  multiline.match: after

- type: log
  paths:
    - /opt/kafka_2.12-1.1.0/logs/kafka.log
  tags: ['{{ system }}', '{{ ansible_hostname }}', '{{ group_name }}']
  multiline.pattern: '^[[:upper:]][[:alpha:]]{2}'
  multiline.negate: true
  multiline.match: after


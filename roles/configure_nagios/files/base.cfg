command[check_service_ssh]=/usr/lib64/nagios/plugins/check_procs -c 1:10 -u root -C sshd -a /usr/sbin/sshd
command[check_service_sssd]=/usr/lib64/nagios/plugins/check_procs -c 1:10 -u root -C sssd
command[check_service_cron]=/usr/lib64/nagios/plugins/check_procs -c 1:100 -u root -C crond
command[check_service_ntp]=/usr/lib64/nagios/plugins/check_procs -c 1:1 -u chrony -C chronyd
command[check_service_syslog]=/usr/lib64/nagios/plugins/check_procs -c 1:1 -u root -C rsyslogd
command[check_swap]=/usr/lib64/nagios/plugins/check_swap -w 10% -c 5%
command[check_disk_system]=/usr/lib64/nagios/plugins/check_disk -w 10% -c 5%  -W 10% -K 5% -e -p / -p /boot -p /var -p /var/log -p /var/log/audit -p /usr -p /opt -p /tmp
command[check_load]=/usr/lib64/nagios/plugins/check_load -w 2.5,2,1.8 -c 5,4,4 -r
command[check_mount]=/usr/lib64/nagios/plugins/check_mount
command[check_hung_mount]=/usr/lib64/nagios/plugins/check_hung_mounts
command[check_rhncfg]=/usr/lib64/nagios/plugins/check_rhncfg
command[check_hpssacli]=/usr/lib64/nagios/plugins/check_ssacli
command[check_cpu]=/usr/lib64/nagios/plugins/check_cpu 30 10
command[check_uptime]=/usr/lib64/nagios/plugins/check_uptime_smaller -c 2 -w 2
command[check_audit_rotation]=/usr/bin/sudo /usr/lib64/nagios/plugins/check_log3.pl -s /tmp/check_audit_rotation.seek -l /var/log/messages -p "Audit daemon rotating log files" -w 15
command[check_avdefs_date]=/usr/lib64/nagios/plugins/check_file_age -f /usr/local/uvscan/avvscan.dat -w 1814400 -c 0
command[check_linux_bonding]=/usr/lib64/nagios/plugins/check_linux_bonding
command[check_ntp]=/usr/lib64/nagios/plugins/check_ntp_time -w 1 -c 5 -H `grep ^server /etc/chrony.conf | head -1| cut -d' ' -f2 `
command[check_hp_hardware]=/usr/lib64/nagios/plugins/check_hpasm
command[check_dns]=/usr/lib64/nagios/plugins/check_dns -H afw-edh-01d -w 5
command[check_disk_linux_cluster]=/usr/lib64/nagios/plugins/check_disk -w 10% -c 5%  -p /var/mw-*
command[check_multipath]=/usr/lib64/nagios/plugins/check-multipath.pl -g "HP,OPEN-V,1,2:COMPELNT,Compellent Vol,3,4:IBM,2810XIV,3,4:VRAID,3,8:"
command[check_splunkd]=/usr/lib64/nagios/plugins/check_procs -c 1:3 -u splunk -C splunkd

text: '<p style="text-align: center;"><span class="default-font-size">G</span><span class="adhoc2">lobal</span><span class="default-font-size"> A</span><span class="adhoc2">daptive</span><span class="default-font-size"> P</span><span class="adhoc2">lanning</span><span class="default-font-size"> C</span><span class="adhoc2">ollaborative</span><span class="default-font-size"> I</span><span class="adhoc2">nformation</span><span class="default-font-size"> E</span><span class="adhoc2">nvironment</span></p><p style="text-align: center;"><span class="default-font-size"> <br /></span></p><p style="text-align: center;"><span style="color: #ff0000;" class="adhoc7"><strong>{{system}}</strong></span><span style="color: #ff0000;" class="adhoc6"><strong><br /></strong></span></p><p style="text-align: left;">&nbsp;</p><p style="text-align: left;"><span class="adhoc3">The purpose of the Global Adaptive Planning (GAP) Collaborative Information Environment (CIE) system is to extend the United States Strategic Command (USSTRATCOM) war-planning system to an integrated, scalable, flexible, and extensible architecture that supports new and evolving capabilities and missions. A key objective is to provide GAP CIE and Global Situational Awareness Tool (GSAT) planning capabilities across the existing command and control (C2) and war-planning applications to improve effectiveness.</span></p>'

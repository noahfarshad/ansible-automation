# tasks file for ipa_hbacrules
- name: Ensure hbacrule sysd is present

  community.general.ipa_hbacrule:
    name: sysd
    description: Allow Example Org Database Administrators access
    servicecategory: all
    hostgroup:
    - sysd
    usergroup:
    - dba
    state: present
    ipa_host: idm01.example.coach
    ipa_user: "admin"
    ipa_pass: "{{ipa_admin_password}}"
  ignore_errors: true


- name: Get Private Key

  ansible.builtin.get_url:
    url: "https://afw-artifactory-t.example.coach/artifactory/afw-certificates/server-certificates/{{ group_name }}/{{ group_name }}.key"
    dest: /etc/pki/tls/private
  tags: certificates

- name: Change Private Key Permissions

  ansible.builtin.file:
    path: "/etc/pki/tls/private/{{ group_name }}.key"
    state: file
    owner: root
    ansible.builtin.group: root
    mode: "0644"
  tags: certificates

- name: Fetch .crt and .jks certs

  ansible.builtin.get_url:
    url: "{{ item }}"
    dest: /etc/pki/tls/certs/
  loop:
    - "https://afw-artifactory-t.example.coach/artifactory/afw-certificates/server-certificates/{{ group_name }}/{{ group_name }}.crt"
    - "https://afw-artifactory-t.example.coach/artifactory/afw-certificates/server-certificates/{{ group_name }}/{{ group_name }}.jks"
  tags: certificates

- name: Change Public Cert Permissions

  ansible.builtin.file:
    path: "/etc/pki/tls/certs/{{ group_name }}.crt"
    state: file
    owner: root
    ansible.builtin.group: root
    mode: "0644"
  tags: certificates

- name: Change Java Keystore Permissions

  ansible.builtin.file:
    path: "/etc/pki/tls/certs/{{ group_name }}.jks"
    state: file
    owner: root
    ansible.builtin.group: root
    mode: "0755"
  tags: certificates


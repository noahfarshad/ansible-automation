---
# tasks file for roles/certificates
- name: Install dod_cacerts

  ansible.builtin.get_url:
    url: https://afw-artifactory-t.example.coach/artifactory/afw-certificates/DoD_CAs/dod_ca_individual_pem.tar.gz
    dest: /etc/pki/tls/certs/dod_ca_individual_pem.tar.gz
  tags: certificates

- name: Install dod_ca_combined.pem

  ansible.builtin.get_url:
    url: https://afw-artifactory-t.example.coach/artifactory/afw-certificates/DoD_CAs/dod_ca_combined.pem
    dest: /etc/pki/tls/certs/dod_ca_combined.pem
  tags: certificates

- name: Install dod_cacerts.jks

  ansible.builtin.get_url:
    url: https://afw-artifactory-t.example.coach/artifactory/afw-certificates/DoD_CAs/dod_cacerts.jks
    dest: /etc/pki/tls/certs/dod_cacerts.jks
  tags: certificates


- name: copy encrypted passphrase to target host

  ansible.builtin.copy:
    src: roles/certificates/files/passphrase/{{passphrase_name}}.enc
    dest: /opt/rh/httpd24/root/etc/httpd/conf/passphrase.enc
    mode: "0664"
  when: passphrase_name is defined
  tags: certificates

- name: copy passphrase shell script to target host

  ansible.builtin.copy:
    src: roles/certificates/files/passphrase.sh
    dest: /opt/rh/httpd24/root/etc/httpd/conf/
    mode: "711"
  when: passphrase_name is defined
  tags: certificates

- name: Unarchive trust certs

  ansible.builtin.unarchive:
    src: /etc/pki/tls/certs/dod_ca_individual_pem.tar.gz
    dest: /etc/pki/ca-trust/source/anchors/
    owner: root
    ansible.builtin.group: root
    mode: 0644
    remote_src: yes
  tags: certificates

- name: Update CA trust
  ansible.builtin.command: update-ca-trust extract

  tags: certificates

#- name: Create symbolic link for java CA certs
#  file:
#    src: "/etc/pki/tls/certs/dod_cacerts.jks"
#    dest: "/usr/lib/jvm-private/afwa/lib/security/cacerts"
#    state: link
#  tags: certificates

  changed_when: false
- name: Cleanup dod_cacerts archive

  ansible.builtin.file:
    name: /etc/pki/tls/certs/dod_ca_individual_pem.tar.gz
    state: absent
  tags: certificates


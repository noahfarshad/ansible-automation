# Place this property file in your base directory.
# (ex. C:\oracle\user_projects\domains\sandbox\app.properties)

# Logging Trace Flags
# (Note: method indentation will only work propery with single-threaded testing.)
methodTrace=false
parameterTrace=false
methodIndent=false

# Flag for turning multi-language on/off
multilanguage.enabled=true

# Indicates if we want caching enabled for app.
cache.enabled=false
# The TTL (in seconds) for the ACL cache, which is per user session
acl.cache.ttl=30

# Indicates the prefix that starts the workflow and timeline ids.
# This is used to filter our other non-ISPAN workflows and timelines
systemWorkflowNameSpacePrefix=mil.stratcom.app


# General Logging Flags
isDebugEnabled=true

# Notification Flags
plan.notification.enabled=false
workflow.notification.enabled=false

# Toplink Flags
toplink.debug.sql.enabled=true
toplink.debug.unitofwork.enabled=false

# Config related to SKIWeb interface.
skiweb.classification.level=SECRET

# Roles
coa.owner.roles=Directors,Planners
poa.owner.roles=Directors,Planners
isr.task.roles=ISRPlanners,Planners

# Network Roles (note releasable roles hardcoded in http header)
network.normal.role=AuthenticatedGroup


# SBMCS configurable intervals
# valid navacc interval values:
#   whole minutes between 1 and 20 inclusive.
# examples: 60 seconds, 3 minutes, 120 seconds, etc...
# valid units values: MINUTES, SECONDS
sbmcs.navacc.interval=20
sbmcs.navacc.units=MINUTES
# valid overflight interval values:
#   6 sec increments between 6 seconds and 10 minutes
# examples: 6 seconds, 12 seconds, 18 seconds, 1 minute, etc...
# valid units values: MINUTES, SECONDS
sbmcs.overflight.interval=6
sbmcs.overflight.units=SECONDS

#The values to display for the nuclear force status operational context filter value
fsr.oper.context=Operational:OPR
fsr.oper.context=Exercise:EXR
fsr.oper.context=ORI:ORI
fsr.oper.context=Training:TRN

# Comma delimited list (no spaces) of available Location Search data sources
facility.search.sources=EDB,GCCS-I3

#The values to display for the JTT Target Type context filter value
jtt.target.query.type=Select One:000
jtt.target.query.type=Facility:FAC
jtt.target.query.type=JDPI:JDP
#Flag to determine if the error message informing the user of JTT attachment problems should be displayed on query error
jtt.show.attachment.error=true

#Subscriber Registry for Event Manager
#CSV list of the categories of events... must match used event categories from mil.stratcom.app.common.model.Event CATEGORY_ members.
eventCategories=0,1,2,3

#Subscriber classes are listed as eventCategorySubscribers.x=ClassName1,ClassName2,etc..

#Workflow Event Subscribers

#The TimeZone which the back end system should use (based on valid Java.util.TimeZone identifiers)
systemTimeZone=Greenwich\\ Mean\\ Time

#The format that will be used to display dates/times based on Java SimpleDateFormat patterns
#defaultDateTimeOutputFormat=EEE\ MMM\ d\ HH:mm:ss\ zzz\ yyyy
defaultDateTimeOutputFormat=ddHHmm'Z' MMMyyyy

#Security enclave.  used by portal to determine "banner".
# also set color here, according to these values.
# UNCLASSIFIED | green
# CONFIDENTAL  | blue
# SECRET       | red
# TS           | (including TS SIOP/ESI) orange
# SCI          | yellow
environmentSecurityEnclave={{system}}.example.coach
environmentSecurityColor=green
environmentSecurityTextColor=black
#for SIPRrel
environmentSecurityEnclave.relto={{system}}.example.coach
environmentSecurityColor.relto=green
environmentSecurityTextColor.relto=black

# Popup Brief PDF Security markings
# these properties are the available options in the Security Filter Selector
# when choosing to generate a PDF. The syntax is as follows:
# pdf.classification.marking=CLASSIFICATION:LABEL:BANNER_COLOR:TEXT_COLOR
# ==ORDER MATTERS==! Make sure that the highest system mark is always listed first.
# uncomment these for JWICS implementation
# pdf.classification.marking=TOP SECRET/SCI:TOP SECRET/SCI (Yellow):#FFFF00:#000000
# pdf.classification.marking=TOP SECRET:TOP SECRET (Orange):#FF6600:#FFFFFF
pdf.classification.marking=SECRET:SECRET (Red):#FF0000:#FFFFFF
pdf.classification.marking=CONFIDENTIAL:CONFIDENTIAL (Blue):#0000FF:#FFFFFF
pdf.classification.marking=UNCLASSIFIED:UNCLASSIFIED (Green):#008000:#FFFFFF

# PDF Brief Unicode Font Location
# this property sets the location for the unicode font used to embed in the pdf.
# Default font location
pdf.font.location=UnDotum.ttf
pdf.font.location=UnDotumBold.ttf
# locale-specific font locations should include .<LocaleDisplayLanguage>
pdf.font.location.English=LiberationSans-Regular.ttf
pdf.font.location.English=LiberationSans-Bold.ttf
pdf.font.location.English=LiberationSans-Italic.ttf
pdf.font.location.English=LiberationSans-BoldItalic.ttf
# os-type font path
pdf.font.path.win=C:\\Windows\\Fonts\\
pdf.font.path.linux=/usr/share/fonts/truetype/

# Online Brief Cache Size Settings
# -'tailsize' controls the size of the cache tail before and after the current slide.
#  A value of zero will essentially disable slide caching
# -'memorylimit' sets the memory limit (in bytes) for caching of images within online briefing.
#  A negative value puts no limit on image cache memory size. A value of zero
#  will prevent any images from caching except those on the current slide.
brief.slidecache.tailsize=2
brief.imagecache.memorylimit=256000000

# Enable or disable caching slidedef.xml files
brief.slidedef.cache=true

# Default auto advance delay in briefing
brief.autoadvance.defaultdelay=5


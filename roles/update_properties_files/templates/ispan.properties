# ------------ Dashboard Tab Caching Properties ------------------
# Be wary that these properties will affect the amount of client machine memory needed to utilize
# system dashboards. Caching is available for the currently-selected dashboard's level as well as
# the parent and child levels of the current dashboard.
#
# If cacheParentOfSelected is true, the parent of the currently selected dashboard
# will be cached. The numParentLevelDashboardsToCache prop determines the number of
# dashboards on either side of the parent that will be cached (1 = 1 left + 1 right).
dashboard.config.lookAhead.cacheParentOfSelected=true
dashboard.config.lookAhead.numParentLevelDashboardsToCache=0
# The numCurrentLevelDashboardsToCache prop determines the number of dashboards on either
# side of the currently-selected dashboard that will be cached (1 = 1 left + 1 right).
dashboard.config.lookAhead.numCurrentLevelDashboardsToCache=1
# If cacheChildrenOfSelected is true, the children of the currently selected dashboard
# will be cached. The numChildrenLevelDashboardsToCache prop determines the number of
# children dashboards (total) that will be cached starting with the left-most child. (1 = only the first child)
dashboard.config.lookAhead.cacheChildrenOfSelected=false
dashboard.config.lookAhead.numChildrenLevelDashboardsToCache=0

# This is the number of levels n that dashboards can be in, there are n-1 child levels
dashboard.config.numDashboardLevels=3

dashboard.config.progressive_refresh.interval=5
dashboard.config.progressive_refresh.interval=10
dashboard.config.progressive_refresh.interval=15
# This is the Dashboard autorefresh rate
# If this changes, then you must also change the TTI ehcache setting for dashboard gadget cache
# It is based off of the final progressive refresh interval * 3
dashboard.config.progressive_refresh.interval=30

# How many ms to wait after all queries are complete before closing the interactive viewer legend
dashboard.config.iv.queries_complete_legend_timeout_ms=3000

# How often the dashboard gadget cache refresher runs (ms)

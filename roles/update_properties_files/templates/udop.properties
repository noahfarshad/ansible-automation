fileopen.url=/gsat/GSAT.do

default.msg.queue.priority=4

#(in minutes)
default.msg.queue.timeToLive=10

# Properties for GSAT files created by CIE interactive viewers
# The file classification mark applies to the file name (portlet.file.name), not to the data contained
# within. The viewer will obtain the mark of the work product. Therefore the portlet.file.classification
# mark should be low.
portlet.file.classification=1000
portlet.file.name=GAP-CIE Interactive Viewer
portlet.viewer.name=GAP-CIE Interactive Viewer

# The maximum allowed image size when exporting from an Interactive Viewer. This is to mitigate a DOS attack against
# the application server memory. The size is the number of bytes of the base64 encoded image, which is roughly 25% larger than the image.
export.image.size.limit=3000000

# The number of viewers (map, timeline, etc) to cache in memory.
# Note that there is a balance between performance and memory footprint here.
gsat.viewer.memory.limit=3

document.repo.base.dir=/u01/domains/vcie_domain/imageShare

# The number of map layers, this value must match the number of map layers defined below.
map.layer.count=10











# The number of seconds for an external system call to delay when waiting for the cache to be populated. Keep this in the range [5,30].
# A smaller number degrades system performance, a larger number degrades user experience.
result.cache.resend.delay=10

# The number of minutes that clustered semaphores live. This timeout mitigates issues caused by stuck semaphores due to JVM failures.
# This should be at least 2x higher than the longest expected process / external service call. If it is too long the work managers can get
# overwhelmed with JMS messages. If this is too short, concurrencies issues can occur such as performance degradation or, in the case of
# SISP (as of 02Feb2013), service failures. Changes are applied at runtime.
result.cache.semaphore.timeout=15


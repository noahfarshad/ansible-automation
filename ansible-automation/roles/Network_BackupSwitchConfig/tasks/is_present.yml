---
# tasks file for Backup Switch Configuration

### STEP 1: Creating a known place that will be used to store configs before updates###

- name: Check if networkbackups folder exists
  ansible.builtin.stat:
    path: \\san01\config\networkbackups
  register: result

- name: Create networkbackups folder if it does not exist
  ansible.builtin.file:
    path: \\san01\config\networkbackups
    state: directory
  when: not result.stat.exists

###STEP 2: Gather the running config and save it to a file###

- name: Gather the running config and save it to a file
  cisco.nxos.nxos_config:
    backup: true
    backup_options:
      filename: "{{ inventory_hostname }}_{{ '%Y-%m-%d' | strftime }}.txt"
      dir_path: /mnt/config/networkbackups
#  when: ansible_network_os == 'cisco.nxos.nxos'


---
# tasks file for install_kafka — present

- name: Create {{kafka_name}} config directory
  become: true
  ansible.builtin.file:
    path: "{{kafka_config_dir}}"
    state: directory
    owner: "{{app_user}}"
    ansible.builtin.group: "{{app_group}}"
    mode: 0755

- name: Create {{kafka_name}} configuration file
  become: true
  become_user: "{{app_user}}"
  ansible.builtin.template:
    src: "server.properties.j2"
    dest: "{{kafka_config_file}}"
    mode: 0755

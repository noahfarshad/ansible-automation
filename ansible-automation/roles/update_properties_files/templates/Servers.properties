popup.brief.url.releasable=https://transrel.{{system}}.example.coach

# URL for popup Assessment History Graphs.  Will change for each environment.
popup.assessmenthistorygraph.url=https://trans.{{system}}.example.coach/imageserver/AnyChart/AssessmentHistoryGraph.html

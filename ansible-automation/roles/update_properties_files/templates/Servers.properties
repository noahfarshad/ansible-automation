#Contingency Planning Plan Manager Role
conplan.project.role.admin=Contingency Plan Manager

#Contingency Planning Search Manager Role
conplan.search.role.admin=Contingency Plan Search Manager

# GSAT Eventing Configuration

# GSAT Eventing JMS 
gsat.subscription.event.cf=gsat.eventing.jms.connectionFactory
gsat.subscription.event.queue=gsat.eventing.jms.queue
gsat.subscription.connection.mode=tmse


# Callback Web Services
tmse.eventing.callback.endpoint=http://vmlb.example.coach:10000/TmseEventsCallbackService/services/BatchedEvents
strikecoi.eventing.callback.endpoint=

#Path to default image to show in place of restricted images.  Location is relatiev to the imageserver base.
restricted.image.path=app/img/restricted.gif

# Default image used for cover page and header of briefings.  Location is relative to the imageserver base.
default.briefings.slideHeaderImage=gnci/images/System_Default_Slide_Header_Logo.gif
default.briefings.coverImage=gnci/images/System_Default_Title_Slide_Logo.gif

# Default image used for order header.  Location is relative to the imageserver base.
default.order.logoImage=gnci/images/System_Default_Slide_Header_Logo.gif

#Used by the endpoint Dashboard from GSAT (non gatewayed environment)
nongatewayed.stylesheet.location=plumtree/common/public/css
nongatewayed.images.location=https://trans.{{system}}.example.coach/imageserver/
nongatewayed.images.location.releasable=https://transrel.{{system}}.example.coach/imageserver/
nongatewayed.staticassets.location=https://trans.{{system}}.example.coach/static-assets/
nongatewayed.staticassets.location.releasable=https://transrel.{{system}}.example.coach/static-assets/

# The following property should match the property above except that it needs to be non-ssl.  This setting
# should only be used by code running on the application server needing to reach the image server, and 
# therefore will not need to be encrypted.  Both properties need to end with the "/".
nongatewayed.images.location.internal=http://vmlb.example.coach:80/imageserver/

# Used to pull images into PDF briefs MUST BE NON-SSL!
nongatewayed.internal.url=http://vmlb.example.coach:10000/

#Used for configurations with separate itrace servers

#Servers.properties defines connection information
#for services used by the ISPAN system.

application.server=localhost

weblogic.INITIAL_CONTEXT_FACTORY=weblogic.jndi.WLInitialContextFactory

#BEA LDAP Domain
weblogic.DOMAIN_NAME=vcie_domain

#true or false flag for sending notifications
#this is used by notificationmanager to determine if emails should be sent when a user resets a password.
notification.enabled=true

#BEA ALSB/OSB Administration Console Information
#Used in the Configuration Dashboard
esb.server.URL=osb.example.coach
esb.server.PORT=7011
esb.server.USER=wl_admin_user
esb.server.PASSWORD=kRB9ySwPpHkTCSoGmZpVvQ==
esb.server.PROTOCOL=t3
esb.services.url=http://vmlb.example.coach:10003
#URL from which the ESB can be accessed externally. Used for GCCS-J Callback
esb.external.url=http://trans.{{system}}.example.coach:50019

#Enter timeout in seconds.
esb.delegate.read.timeout=300

#Portal Remote Session information
portal.ENDPOINT=http://vmlb.example.coach:80/ptapi/services/QueryInterfaceAPI
#the following portal.server value is for the proxy url
portal.server=trans.{{system}}.example.coach
portal.entry.url=https://trans.{{system}}.example.coach/portal/server.pt
portal.entry.url.releasable=https://transrel.{{system}}.example.coach/portal/server.pt
portal.ptportal.schema=CP_Example_PTPORTAL
portal.ptportal.schema.releasable=CP_Example_SIPRRELPTPORTAL

# The following settings are for requests intended to go around the portal.  These should be set to the 
# server that is first hit by a user's client/browser.  In a normal cluster, that would be the proxy server.
nongatewayed.proxy.server=https://trans.{{system}}.example.coach
nongatewayed.proxy.server.releasable=https://transrel.{{system}}.example.coach

#Login URLs
#  Normal CIE Login
cie.login=https://trans.{{system}}.example.coach/app_main/
#  SIPR Rel Login
cie.login.sipr.rel=https://transrel.{{system}}.example.coach/app_release

#GSAT URLs
#  Normal GSAT
gsat.url=https://trans.{{system}}.example.coach/gsat/GSAT.do
#  SIPR Rel GSAT
gsat.url.sipr.rel=https://transrel.{{system}}.example.coach/gsat/GSAT.do

#Logout URLs
#  Normal CIE Logout
cie.logout=https://trans.{{system}}.example.coach/oam/server/logout?end_url=/authentication/logoutPage.do
#  SIPR Rel Logout
cie.logout.sipr.rel=https://transrel.{{system}}.example.coach/oam/server/logout?end_url=/authentication/logoutPage.do


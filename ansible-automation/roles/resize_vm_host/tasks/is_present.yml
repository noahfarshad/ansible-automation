---
# tasks file for resize_vm_host — present

# This playbook will resize the RHEL7.5 STIG image to fit an increased filesystem size after changing the disk space in users.vcenter_admin_user
# Assumptions: 
# * You have already increased the disk size through users.vcenter_admin_user
---
- name: Resize RHEL Disk
  become: true
  vars:
    disk: /dev/sda
    partition: 2
    volgroup: rhel
    logvol: root
  block:
  - name: Get info
    parted: 
      device: "{{ disk }}"
      state: info
    register: diskinfo

  - name: Remove partition 
    parted: 
      device: "{{ disk }}"
      number: "{{ partition }}"
      state: absent

  - name: Recreate partition
    parted: 
      device: "{{ disk }}"
      number: "{{ partition }}"
      state: present
      flags: [ lvm ]
      part_start: "{{ diskinfo.partitions[1].begin }}KiB"


  - name: Run partx
    ansible.builtin.shell: "partx -u {{ disk }}"

    changed_when: false
  - name: Resize primary volume
    ansible.builtin.shell: "pvresize {{ disk }}{{ partition }}"

    changed_when: false
  - name: Extend the logical volume to consume all remaining space in the volume group
    lvol:
      vg: rhel
      lv: root
      size: +100%FREE
      resizefs: yes      
 
  - name: Grow the filesystem
    ansible.builtin.shell: "xfs_growfs /dev/{{ volgroup }}/{{ logvol }}"

    changed_when: false

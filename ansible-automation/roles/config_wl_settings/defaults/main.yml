---

# Domain Name
WebLogic_Domain: wl_domain

#Admin Server Properties
Admin_Server: wl-admin.example.coach
Admin_Server_HTTP_Port: 7201
Admin_Server_HTTPS_Port: 7202
Admin_Username: wl_admin_user

Admin_Protocol: t3s

gc2_wlst_path: "{{mw_home}}/oracle_common/common/bin/wlst.sh"

additional_jvm_args: ''

os_user: app_admin
os_group: app_admin
gc2_remote_dir: /tmp

ansible_os_user: ansible
ansible_os_group: ansible



# Important Note.  In order to connect to the Admin Server you need SSL encrypted certificate (config) and Key files.
#  In the example environment those files are created by role: installers/create_wlst_credentials.  And this role assumes
#  those files are created and exist in the specified directory.
# 
#  The files that are created are:
#     /home/apps/app_admin/gc2/wlConfig.secure
#     /home/apps/app_admin/gc2/wlKey.secure
# 
#  If this role is used on another project; project specific config and key files will have to be created
#  and used.

admin_server_encrypted_config_file: /home/apps/app_admin/gc2/wlConfig.secure
admin_server_encrypted_key_file: /home/apps/app_admin/gc2/wlKey.secure

pickle_file_name: pickled_vars.p

wl_config_settings:

#  Admin Console SSL Configuration

- name: AdminKeystoreName 
  IsModifiable: NO 
  sectionName: SecurityRealm.Root
  settingPath: /Servers/AdminServer 
  settingName: KeyStores 
  settingValue: CustomIdentityAndJavaStandardTrust 

- name: AdminCustomIdentityKeyStoreFileName 
  IsModifiable: NO 
  sectionName: SecurityRealm.Root
  settingPath: /Servers/AdminServer 
  settingName: CustomIdentityKeyStoreFileName 
  settingValue: /opt/identity/identity.jks 

- name: AdminSSLCustomIdentityKeyStoreType 
  IsModifiable: NO 
  sectionName: SecurityRealm.Root
  settingPath: /Servers/AdminServer 
  settingName: CustomIdentityKeyStoreType 
  settingValue: JKS 

- name: AdminSSLListenAddress 
  IsModifiable: NO 
  sectionName: SecurityRealm.Root
  settingPath: /Servers/AdminServer 
  settingName: ListenAddress 
  settingValue: wl-admin.example.coach 

- name: AdminSSLListenPort 
  IsModifiable: NO 
  sectionName: SecurityRealm.Root
  settingPath: /Servers/AdminServer/SSL/AdminServer 
  settingName: ListenPort 
  settingValue: 7202 

- name: AdminSSLEnabled 
  IsModifiable: NO 
  sectionName: SecurityRealm.Root
  settingPath: /Servers/AdminServer/SSL/AdminServer 
  settingName: Enabled 
  settingValue: true 

- name: AdminSSLTwoWaySSLEnabled 
  IsModifiable: NO 
  sectionName: SecurityRealm.Root
  settingPath: /Servers/AdminServer/SSL/AdminServer 
  settingName: TwoWaySSLEnabled 
  settingValue: true 

- name: AdminSSLServerPrivateKeyAlias 
  IsModifiable: NO 
  sectionName: SecurityRealm.Root
  settingPath: /Servers/AdminServer/SSL/AdminServer 
  settingName: ServerPrivateKeyAlias 
  settingValue: wl-admin.local 

- name: AdminSSLHostnameVerificationIgnored 
  IsModifiable: NO 
  sectionName: SecurityRealm.Root
  settingPath: /Servers/AdminServer/SSL/AdminServer 
  settingName: HostnameVerificationIgnored 
  settingValue: false 


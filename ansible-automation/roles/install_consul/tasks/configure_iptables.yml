- name: "Redirect all incoming tcp requests on port 53 to port 8600"
  become: true
  iptables:
    table: nat
    action: append
    chain: PREROUTING
    protocol: tcp
    match: [tcp]
    destination_port: 53
    to_ports: 8600
    jump: REDIRECT

- name: "Redirect all incoming udp requests on port 53 to port 8600"
  become: true
  iptables:
    table: nat
    action: append
    chain: PREROUTING
    protocol: udp
    match: [udp]
    destination_port: 53
    to_ports: 8600
    jump: REDIRECT

- name: "Redirect all outgoing udp requests on port 8600 to port 53"
  become: true
  iptables:
    table: nat
    action: append
    chain: OUTPUT
    protocol: udp
    match: [udp]
    destination: "{{ ansible_default_ipv4.address }}"
    destination_port: 53
    to_ports: 8600
    jump: REDIRECT

- name: "Redirect all outgoing tcp requests on port 8600 to port 53"
  become: true
  iptables:
    table: nat
    action: append
    chain: OUTPUT
    protocol: tcp
    match: [tcp]
    destination: "{{ ansible_default_ipv4.address }}"
    destination_port: 53
    to_ports: 8600
    jump: REDIRECT

- include_role:
    name: common/persist_iptables
---
# tasks file for change_portal_config_urls — present

# This task is to update the urls for portal configuration files after a clone.
# This was previously done in the changeGapCieUrls.sh shell script

- name: Update urls in portal configuration files
  become: true
  become_user: app_admin
  ansible.builtin.replace:
    dest: "{{ item }}"
    regexp:  "{{ source }}"
    ansible.builtin.replace:  "{{ system }}"
  loop:
    - "/opt/Oracle/Middleware/wci/settings/portal/portalconfig.xml"
    - "/opt/Oracle/Middleware/wci/settings/configuration.xml"

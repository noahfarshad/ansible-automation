---
# tasks file for install_wl_monitor — present

#
#  Update Weblogic with the required monitoring updates
#  In the config.xml add a Mail session and a reference to
#  a Module Health Watch.
#
#  In addition, create a diagnostics directory and add the necessary
#  health watch files to that directory
#

- block:
    - name: "Check if the config diagnostics directory already exists"

      become_user: "{{os_user}}"
      ansible.builtin.stat: path={{diagnostics_dir}}
      register: stat_result

    - name: "Create config diagnostics directory if it doesn't exist..."

      become_user: "{{os_user}}"
      ansible.builtin.file:
        state: directory
        path: "{{diagnostics_dir}}"
        mode: 0750
      when: stat_result.stat.exists == False

    - name: Pickle role vars
      local_action: command python {{pickler}} {{role_path}}/vars/main.yml {{role_path}}/files/pickled_vars.p
      run_once: true

    - name: Change Ownership of Local pickle file

      local_action: command chown  {{ansible_os_user}}:{{ansible_os_group}} {{role_path}}/files/pickled_vars.p
      run_once: true

    - name: "Copy Over Template files"

      become_user: "{{os_user}}"
      ansible.builtin.template:
        src: "{{ item }}"
        dest: "{{remote_dir}}"
        owner: "{{os_user}}"
        ansible.builtin.group: "{{os_group}}"
        mode: 0600
      loop:
        - update_config_xml.py
        - configure_mail_session.py
        - moduleHealthState.xml

    - name: "Copy required files to the Diagnostics Dir"

      ansible.builtin.copy: src={{item}} dest={{diagnostics_dir}} mode=0640
      loop: "{{diagnostics_file_list}}"

    - name: "Copy Over Pickle File"

      become_user: "{{os_user}}"
      ansible.builtin.copy:
        src: "{{pickle_file_name}}"
        dest: "{{remote_dir}}"
        owner: "{{os_user}}"
        ansible.builtin.group: "{{os_group}}"
        mode: 0600

    #  Important; only create the mail session on vm4 otherwise it will error!
    - name: Create the Mail Session

      become_user: '{{os_user}}'
      ansible.builtin.shell: "{{gc2_wlst_path}} {{remote_dir}}/configure_mail_session.py"
      when: "'vm4' in inventory_hostname"

      # TODO: review changed_when for: {{gc2_wlst_path}} {{remote_dir}}/configure_mail_session.py
    - name: Update config.xml file

      become_user: '{{os_user}}'
      ansible.builtin.shell: 'python {{remote_dir}}/update_config_xml.py'

      # TODO: review changed_when for: python {{remote_dir}}/update_config_xml.py
    - name: "Copy Pickle File locally"
      local_action: command cp {{role_path}}/files/pickled_vars.p "{{remote_dir}}"
      run_once: true

    - name: "Copy mailSessionSettingsFile.py locally"
      local_action: template src=mailSessionSettingsFile.py dest="{{remote_dir}}" 
      run_once: true

    - name: Generate the mail session settings file
      local_action: command python {{remote_dir}}/mailSessionSettingsFile.py
      run_once: true

    - name: Change Ownership of Local setting file

      local_action: command chown  {{ansible_os_user}}:{{ansible_os_group}} {{remote_dir}}/wlsConfigSettings__Monitor.txt
      run_once: true

    - name: "Remove update_config_xml.py"

      become_user: "{{os_user}}"
      ansible.builtin.file: 
        path: "{{remote_dir}}/update_config_xml.py"
        state: absent 

    - name: "Remove configure_mail_session.py"

      become_user: "{{os_user}}"
      ansible.builtin.file: 
        path: "{{remote_dir}}/configure_mail_session.py"
        state: absent 

    - name: "Remove pickle file"

      become_user: "{{os_user}}"
      ansible.builtin.file: 
        path: "{{remote_dir}}/pickled_vars.p"
        state: absent 

    - name: "Remove local mailSessionSettingsFile.py"

      local_action: file path={{remote_dir}}/mailSessionSettingsFile.py state=absent
      run_once: true

    - name: "Remove local pickle file from /tmp"

      local_action: file path={{remote_dir}}/pickled_vars.p state=absent
      run_once: true

    - name: "Remove local pickle file"

      local_action: file path={{role_path}}/files/pickled_vars.p state=absent
      run_once: true
  become: true

---
- block: 
  - name: Check Restart Status
    ansible.windows.win_shell: |
      Get-WURebootStatus -Silent
    register: restart_needed

  - name: Reboot Host
    ansible.windows.win_reboot:
    when: restart_needed.stdout == 'True\r\n'

  - name: Wait Until SSH is back 
    ansible.windows.win_service: 
      name: 'sshd'
      state: started

  - name: Use Windows Update
    ansible.windows.win_shell: 'wuauclt /reportnow'
    
  become: true
  become_method: runas
  become_flags: logon_type=new_credentials logon_flags=netcredentials_only
  vars:
    ansible_become_user: "{{system_name}}\\{{domainadmin_user}}"
    ansible_become_password: '{{domain_password}}'
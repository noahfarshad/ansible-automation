---
# tasks file for configure_windows

- block:
    - name: set the default shell to PowerShell
      ansible.windows.win_regedit:
        path: HKLM:\SOFTWARE\OpenSSH
        name: DefaultShell
        data: C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe
        type: string
        state: present
      ignore_errors: true  #Fail safe for vsphere_vm customization spec/role

    - name: Set Timezone to UTC
      community.windows.win_timezone:
        ansible.builtin.timezone: UTC
      tags: [ set_win_timezone ]

    - name: Create baseline variable
      ansible.builtin.set_fact:
        baseline: {}

    - name: Get installed software
      ansible.windows.win_shell: |
          $keynames = (get-childitem HKLM:\software\microsoft\windows\currentversion\uninstall `
                       | select -ExpandProperty Name).replace("HKEY_LOCAL_MACHINE","HKLM:");
          $keynames += (get-childitem `
                        HKLM:\software\wow6432node\microsoft\windows\currentversion\uninstall `
                         | select -ExpandProperty Name).replace("HKEY_LOCAL_MACHINE","HKLM:");
          $display = foreach ($key in $keynames) `
                  { get-itemproperty $key `
                    | ? {$null -ne $_.displayname -and $null -ne $_.displayversion} `
                    | select DisplayName, DisplayVersion}
          $display_name = ''
          $display_version = ''
          foreach ($item in $display) `
                  { $display_name += '"'+$item.DisplayName+'": ' + '///'
                    $display_version += '"'+$item.DisplayVersion+'"'  + '///'}
          $display_name = $display_name -split '///'
          $display_version = $display_version -split '///'
          $output = ''
          for ($i=0; $i -lt $display_name.Length; $i++)
                  {$output += $display_name[$i] + $display_version[$i] + '///'}
          $output = $output -split '///'
          echo $output
      register: version
      changed_when: false

    - name: Set Software Baseline Dictionary
      ansible.builtin.set_fact:
        baseline: "{{ baseline | combine(version.stdout | from_yaml)}}"
      when: version
  become: true

---
# tasks file for download_installation_artifacts — present

# These tasks download the necessary artifacts to install weblogic
- name: Create string staging directory if it does not exist.
  ansible.builtin.file:
    path: "{{staging}}"
    state: directory
    mode: 0755

- name: Download Installation files
  ansible.builtin.get_url:
    url: http://{{nexus_host}}/{{nexus_public}}/{{item.0.group}}/{{item.1}}/{{item.0.version}}/{{item.1}}-{{item.0.version}}.{{item.0.ext}}
    dest: "{{staging}}"
    timeout: 30
  with_subelements:
    - "{{installation_artifacts}}"
    - files

- name: Download Cache files
  ansible.builtin.get_url:
    url: http://{{nexus_host}}/{{nexus_public}}/{{item.group}}/{{item.artifact}}/{{item.version}}/{{item.artifact}}-{{item.version}}.{{item.ext}}
    dest: "{{staging}}"
    timeout: 30
  loop:
    - "{{cache_libraries}}"

---
## This role needs to be ran as the primary DC to work properly. Either switch roles to dc1, or set hosts in the playbook to the primaryDC 

# Remove unsupported IFC OU
# - name: Ensure {{pre_ifc}} OU is absent #to delete if protected
#   microsoft.ad.ou:
#     name: '{{pre_ifc}}'
#     state: absent

###Check for C:\GPO_XXXX according to ADD doc number

- name: Set environment color for IFC if even
  ansible.builtin.set_fact:
    color: 'BLUE'
  when: "{{ ifc[-1::] }} % 2 == 0"

- name: Set environment color for IFC if odd
  ansible.builtin.set_fact: 
    color: 'GREEN'
  when: "{{ ifc[-1::] }} % 2 != 0"

# Link delta domain GPOs
- name: Link {{ domain_ou | upper }}_{{ ADD_PN_Delta }} Domain GPOs 
  ansible.windows.win_shell: |
    $exists = (Get-GPO -All).DisplayName
    $name = "{{ domain_ou | upper }}_{{ ADD_PN_Delta }} - {{ item }}"
    foreach ($e in $exists)
    {
      if ($name -in $e)
      {
        $LinksPaths = ""
        $LinksEnableds = ""

        [xml]$gpocontent =  Get-GPOReport $e -ReportType xml
  
        $LinksPaths = $gpocontent.GPO.LinksTo #| %{$_.SOMPath}
        $LinksEnableds = $gpocontent.GPO.LinksTo #| %{$_.Enabled}

        $DomainOU = "DC={{domain_ou}},DC=local"
        $LinkedDomainGPOs = Get-ADOrganizationalUnit $DomainOU | Select-object -ExpandProperty LinkedGroupPolicyObjects

        $DomainOU | ForEach-Object { if ($name -notin $LinkedDomainGPOs) { New-GPLink -Name $name -Target $DomainOU -LinkEnabled Yes -ErrorAction SilentlyContinue }}
      }
    }
  loop: "{{ domain_delta_gpos }}"
  when: "{{ domain_delta_gpos }} | length > 0"
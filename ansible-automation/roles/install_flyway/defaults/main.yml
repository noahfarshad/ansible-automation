---
nexus_host: 10.10.10.204:7778
#The public nexus URL will route to the actual URL without needing to know the actual repository
##Format for this URL is:
## {nexus_host}/nexus/service/local/artifact/maven/redirect?r=public&g={group}&a={artifact}&v={version}&e={extension}&c={classifier}
nexus_public: nexus/service/local/artifact/maven/redirect?r=public
example_group: Flyway
dest_dir: /opt/oracle/app/


flyway:
  - ext: 'tar.gz'
    files:
      - flyway-commandline
    classifier: x64

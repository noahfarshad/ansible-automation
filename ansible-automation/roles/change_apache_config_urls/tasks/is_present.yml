---
# tasks file for change_apache_config_urls — present

# This task is to update the urls for Apache configuration files after a clone.
# This was previously done in the changeGapCieUrls.sh shell script

- name: Update urls in apache configuration files
  become: true
  become_user: app_admin
  ansible.builtin.replace:
    dest: "{{ item }}"
    regexp:  "{{ source }}"
    ansible.builtin.replace:  "{{ system }}"
  loop:
    - "/opt/apache24/conf/app-httpd/app.conf"

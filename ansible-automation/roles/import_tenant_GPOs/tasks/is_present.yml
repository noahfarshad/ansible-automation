# Import tenant1 GPOs
- name: Import {{ tenant1 }} Domain GPOs
  ansible.windows.win_shell: |
    $name = "{{tenant1}} - {{item}}"
    $exists = (Get-GPO -All).DisplayName
    if ( $name -notin $exists )
    {
      New-GPO -Name "{{tenant1}} - {{item}}" -ErrorAction SilentlyContinue
      Import-GPO -BackupGpoName "{{item}}" -TargetName "{{tenant1}} - {{item}}" -Path "C:\GPO_{{ tenant1 }}\{{item}}"
    }
  loop: "{{tenant1_domain_gpos}}"


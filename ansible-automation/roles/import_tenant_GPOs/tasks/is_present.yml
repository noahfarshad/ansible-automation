# Link tenant1 GPOs
- name: Link {{ tenant1 }} Domain GPOs 
  ansible.windows.win_shell: |
    $exists = (Get-GPO -All).DisplayName
    $name = "{{tenant1}} - {{item}}"
    foreach ($e in $exists)
    {
      if ($name -in $e)
      {
        $LinksPaths = ""
        $LinksPath = ""
        $LinksEnableds = ""
        $LinkEnabled = ""

        [xml]$gpocontent =  Get-GPOReport $e -ReportType xml
  
        $LinksPaths = $gpocontent.GPO.LinksTo #| %{$_.SOMPath}
        $LinksEnableds = $gpocontent.GPO.LinksTo #| %{$_.Enabled}
      
        if (( -not $LinksPaths ) -and ( -not $LinksEnableds ))
        {
          New-GPLink -Name "{{tenant1}} - {{item}}" -Target "DC={{domain_ou}},DC=local" -LinkEnabled Yes -ErrorAction SilentlyContinue
        }
      }
    }
  loop: "{{tenant1_domain_gpos}}"


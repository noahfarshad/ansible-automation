# Verify tenant1 OUs are present
- name: Verify {{tenant1}} OU exists
  microsoft.ad.ou:
    name: '{{tenant1}}'
    protect_from_deletion: false
    state: present 

- name: Verify {{tenant1}} Servers OU exists
  microsoft.ad.ou:
    name: Servers
    path: OU={{tenant1}},DC={{domain_ou}},DC=local
    protect_from_deletion: false
    state: present

- name: Verify {{tenant1}} Workstations OU exists 
  microsoft.ad.ou:
    name: Workstations
    path: OU={{tenant1}},DC={{domain_ou}},DC=local
    protect_from_deletion: false
    state: present

- name: Verify {{tenant1}} VDI OU exists
  microsoft.ad.ou:
    name: VDI
    path: OU={{tenant1}},DC={{domain_ou}},DC=local
    protect_from_deletion: false
    state: present

- name: Verify {{tenant1}} RHEL OU exists
  microsoft.ad.ou:
    name: RHEL
    path: OU={{tenant1}},DC={{domain_ou}},DC=local
    protect_from_deletion: false
    state: present

# Verify Domain Controllers OU is present
- name: Verify Domain Controllers OU exists
  microsoft.ad.ou:
    name: Domain Controllers
    protect_from_deletion: false
    state: present


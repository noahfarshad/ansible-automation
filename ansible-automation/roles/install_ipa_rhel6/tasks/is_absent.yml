---
# tasks file for install_ipa_rhel6 — absent
#
# Stops the service, removes the package.

- name: Stop and disable service
  ansible.builtin.service:
    name: "network"
    state: stopped
    enabled: false
  failed_when: false

- name: Remove package(s)
  ansible.builtin.package:
    name: "{{ package_list | default([]) }}"
    state: absent
  when: (package_list | default([])) | length > 0

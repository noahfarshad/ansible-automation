---
name: lint
on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Ansible + linters
        run: pip install ansible-core ansible-lint yamllint

      - name: yamllint (advisory)
        run: yamllint playbooks/ inventory.example/ requirements.yml || true

      - name: ansible-lint (advisory)
        run: ansible-lint playbooks/ -x risky-shell-pipe,no-changed-when || true

  syntax:
    runs-on: ubuntu-latest
    env:
      ANSIBLE_COLLECTIONS_PATH: ${{ github.workspace }}/collections
      ANSIBLE_ROLES_PATH: ${{ github.workspace }}/roles
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Ansible
        run: pip install ansible-core

      - name: Install Galaxy collections
        run: |
          mkdir -p collections
          ansible-galaxy collection install -r requirements.yml -p collections
          echo "Installed collections:"
          ls -la collections/ansible_collections/ || echo "(no ansible_collections dir)"

      - name: ansible-playbook --syntax-check
        run: |
          for pb in playbooks/site.yml \
                   playbooks/linux/build_linux_vm.yml \
                   playbooks/linux/configure_webserver.yml \
                   playbooks/linux/configure_dbserver.yml \
                   playbooks/linux/configure_appserver.yml \
                   playbooks/windows/build_windows_vm.yml \
                   playbooks/windows/configure_baseline.yml \
                   playbooks/windows/install_software.yml; do
            echo "=== syntax-check: $pb ==="
            ansible-playbook -i inventory.example/hosts --syntax-check "$pb"
          done
